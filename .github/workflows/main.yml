from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.lang import Builder

# طراحی رابط کاربری با زبان Kivy (.kv)
# این بخش ظاهر برنامه را به صورت متنی توصیف می‌کند.
kv_design = """
<MainUI>:
    orientation: 'vertical'
    padding: dp(20)
    spacing: dp(20)
    
    # تنظیم رنگ پس‌زمینه اصلی (رنگ آبی-خاکستری روشن)
    canvas.before:
        Color:
            rgba: 0.95, 0.96, 0.98, 1
        Rectangle:
            pos: self.pos
            size: self.size

    # کادر بالا برای متن (لیبل)
    BoxLayout:
        size_hint_y: 0.6
        padding: dp(20)
        
        Label:
            text: "تبریک! شما اولین اپ پایتونی\\nخود را زیبا کردید!"
            font_size: '22sp'
            halign: 'center'
            valign: 'middle'
            color: 0.1, 0.1, 0.2, 1  # رنگ متن تیره
            # bold: True  # اگر فونت فارسی دارید، بهتر است از فونت استفاده کنید تا बोल्ड
            text_size: self.width, None

    # کادر پایین برای دکمه
    AnchorLayout:
        size_hint_y: 0.4
        anchor_x: 'center'
        anchor_y: 'center'

        # دکمه با لبه‌های گرد و رنگی
        Button:
            text: "پایان عالی این مرحله"
            size_hint: None, None
            size: dp(200), dp(60)
            font_size: '18sp'
            background_color: 0.3, 0.6, 0.9, 0  # رنگ دکمه نامرئی تا رنگ پس‌زمینه (canvas) دیده شود
            color: 1, 1, 1, 1  # رنگ متن دکمه (سفید)
            on_release: app.on_button_click()

            # رسم لبه‌های گرد و رنگ آبی برای دکمه
            canvas.before:
                Color:
                    rgba: 0.3, 0.6, 0.9, 1  # رنگ آبی روشن دکمه
                RoundedRectangle:
                    pos: self.pos
                    size: self.size
                    radius: [dp(30),]  # شعاع گردی لبه‌ها
"""

# لود کردن طراحی KV
Builder.load_string(kv_design)

class MainUI(BoxLayout):
    pass

class BeautifulApp(App):
    def build(self):
        # تنظیم عنوان برنامه (در نوار وضعیت اندروید دیده می‌شود)
        self.title = "اولین اپ زیبای من"
        return MainUI()

    # عملی که هنگام کلیک روی دکمه انجام می‌شود
    def on_button_click(self):
        # چاپ متن در کنسول اندروید (برای تست)
        print("دکمه با موفقیت کلیک شد!")
        # تغییر متن لیبل (اختیاری - برای افزودن تعامل بیشتر)
        # برای این کار نیاز به تنظیم id در فایل KV است که فعلاً برای سادگی حذف کردیم.
        # اما اپ همینطوری هم زیبا شده است.

if __name__ == '__main__':
    BeautifulApp().run()
