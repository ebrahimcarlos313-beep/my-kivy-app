name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0" buildozer kivy

    - name: Prepare Files
      run: |
        if [ -f apk.py ]; then
          mv apk.py main.py
        fi
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # تنظیم نسخه پایتون و کیوی در buildozer.spec
        sed -i 's/^requirements =.*/requirements = python3,kivy/g' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        export ACCEPT_SDK_LICENSE=1
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
