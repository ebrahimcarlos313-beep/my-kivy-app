name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade "cython<3.0" buildozer

    - name: Prepare main.py
      run: |
        if [ -f apk.py ]; then
          mv apk.py main.py
        fi

    - name: Create buildozer.spec if not exists
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

    - name: Build APK
      run: |
        # پذیرش خودکار لایسنس‌های اندروید و اجرا با پرچم غیرتعاملی
        export ACCEPT_SDK_LICENSE=1
        printf 'y\ny\ny\ny\ny\n' | buildozer -v android debug || buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
