name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: System dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libffi-dev build-essential ccache git python3-dev libncurses5-dev libncursesw5-dev zlib1g-dev openjdk-17-jdk zip unzip ant ccache clang libtinfo5

    - name: Build with Buildozer
      run: |
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
